<form [formGroup]="clienteForm" (ngSubmit)="submitForm()">
    <div class="mb-3">
        <label class="form-label">Descripción de tu Empresa/Proyecto</label>
        <textarea class="form-control bg-dark text-light border-secondary" formControlName="descripcion"
            rows="3"></textarea>
        @if (clienteForm.get('descripcion')?.invalid && clienteForm.get('descripcion')?.touched) {
        <small class="text-warning">La descripción es requerida.</small>
        }
    </div>
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <label class="form-label">Sector Comercial</label>
            <input type="text" class="form-control bg-dark text-light border-secondary" formControlName="sector">
            @if (clienteForm.get('sector')?.invalid && clienteForm.get('sector')?.touched) {
            <small class="text-warning">El sector es requerido.</small>
            }
        </div>
        <div class="col-md-6">
            <label class="form-label">Sitio Web (Opcional)</label>
            <input type="text" class="form-control bg-dark text-light border-secondary" formControlName="sitioWeb"
                placeholder="https://...">
        </div>
    </div>
    <button type="submit" class="btn btn-info w-100 fw-bold text-dark" [disabled]="isLoading">
        @if (isLoading) { <span class="spinner-border spinner-border-sm me-2"></span> Guardando... } @else { Completar
        Perfil }
    </button>
</form>
