<div class="card bg-secondary text-light shadow-sm border-0" [ngClass]="{
        'border-info border': entrega.estado === enumEntrega.Pendiente,
        'border-success border': entrega.estado === enumEntrega.Aprobada,
        'border-danger border': entrega.estado === enumEntrega.Rechazada
        }">
    <div class="card-body p-3">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="small text-light opacity-50"><i class="fa-solid fa-calendar-day me-1"></i> {{ entrega.fecha
                }}</span>
            <span class="badge" [ngClass]="{
        'bg-info text-dark': entrega.estado === enumEntrega.Pendiente,
        'bg-success': entrega.estado === enumEntrega.Aprobada,
        'bg-danger': entrega.estado === enumEntrega.Rechazada
        }">{{ entrega.estado }}</span>
        </div>

        <p class="small mb-3 border-start border-3 border-dark ps-2">{{ entrega.descripcion }}</p>

        <div class="mb-2">
            <a [href]="entrega.archivo" target="_blank" class="small text-info fw-bold text-decoration-none">
                <i class="fa-solid fa-link me-1"></i> Abrir Archivo Adjunto
            </a>
        </div>

        @if (entrega.estado === enumEntrega.Rechazada && entrega.motivo_rechazo) {
        <div class="mt-3 p-2 bg-dark border-start border-danger border-3 rounded small">
            <strong class="text-danger">Motivo del Rechazo:</strong><br>
            <span class="opacity-75">{{ entrega.motivo_rechazo }}</span>
        </div>
        }

        @if (vistaRol === 'cliente' && entrega.estado === enumEntrega.Pendiente) {
        <div class="d-flex gap-2 mt-3 pt-3 border-top border-dark">
            <button class="btn btn-sm btn-outline-danger w-50" (click)="onRechazar.emit(entrega.entregaId)">
                <i class="fa-solid fa-xmark me-1"></i> Rechazar
            </button>
            <button class="btn btn-sm btn-success fw-bold text-dark w-50" (click)="onAprobar.emit(entrega.entregaId)">
                <i class="fa-solid fa-check me-1"></i> Aprobar
            </button>
        </div>
        }

    </div>
</div>
