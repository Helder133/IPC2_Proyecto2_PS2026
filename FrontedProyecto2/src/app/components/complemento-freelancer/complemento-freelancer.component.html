<form [formGroup]="freelancerForm" (ngSubmit)="submitForm()">
    <div class="mb-3">
        <label class="form-label">Sobre ti (Descripción profesional)</label>
        <textarea class="form-control bg-dark text-light border-secondary" formControlName="descripcion"
            rows="3"></textarea>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-md-6">
            <label class="form-label">Nivel de Experiencia</label>
            <select class="form-select bg-dark text-light border-secondary" formControlName="experiencia">
                <option value="" disabled selected>Selecciona nivel...</option>
                <option [value]="EnumFreelancer.Junior">Junior</option>
                <option [value]="EnumFreelancer.Semi_Senior">Semi-Senior</option>
                <option [value]="EnumFreelancer.Senior">Senior</option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Tarifa por Hora (Q)</label>
            <input type="number" class="form-control bg-dark text-light border-secondary" formControlName="tarifaHora"
                step="0.01">
        </div>
    </div>

    <div class="mb-4">
        <label class="form-label">Tus Habilidades (Selecciona al menos una)</label>
        <div class="row border border-secondary rounded p-3 bg-dark">
            @for (hab of habilidades(); track hab.habilidadId) {
            <div class="col-md-4 mb-2">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" [id]="'hab'+hab.habilidadId"
                        (change)="toggleHabilidad(hab.habilidadId, $event)">
                    <label class="form-check-label" [for]="'hab'+hab.habilidadId">
                        {{ hab.nombre }}
                    </label>
                </div>
            </div>
            } @empty {
            <p class="text-muted small">Cargando habilidades...</p>
            }
        </div>
        @if (habilidadesSeleccionadas.size === 0 && freelancerForm.touched) {
        <small class="text-warning">Debes seleccionar al menos una habilidad.</small>
        }
    </div>

    <button type="submit" class="btn btn-info w-100 fw-bold text-dark" [disabled]="isLoading">
        @if (isLoading) { <span class="spinner-border spinner-border-sm me-2"></span> Guardando... } @else { Completar
        Perfil }
    </button>
</form>
