<div class="card bg-secondary text-light shadow-sm h-100 border border-dark">
    <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-start mb-2">
            <h5 class="card-title text-info fw-bold mb-0">{{ item.nombre }}</h5>
            <span class="badge" [class.bg-success]="item.estado" [class.bg-danger]="!item.estado">
                {{ item.estado ? 'Activo' : 'Inactivo' }}
            </span>
        </div>
        <p class="card-text text-light opacity-75 small flex-grow-1">{{ item.descripcion }}</p>

        <div class="d-flex gap-2 mt-3 pt-3 border-top border-dark">
            <button class="btn btn-sm btn-outline-info flex-grow-1" (click)="onEdit.emit(item)">
                <i class="fa-solid fa-pen me-1"></i> Editar
            </button>
            <button class="btn btn-sm" [class.btn-outline-danger]="item.estado"
                [class.btn-outline-success]="!item.estado" (click)="onToggleEstado.emit(item)">
                <i class="fa-solid" [class.fa-ban]="item.estado" [class.fa-check]="!item.estado"></i>
            </button>
        </div>
    </div>
</div>
